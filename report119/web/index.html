<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>119 관제내역 → 상황보고서</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'Malgun Gothic','맑은 고딕',sans-serif; background:#f0f2f5; color:#222; }
.app { max-width:760px; margin:0 auto; padding-bottom:80px; }

.header { background:#c62828; color:#fff; padding:18px 16px; text-align:center; position:sticky; top:0; z-index:10; }
.header h1 { font-size:18px; }
.header small { font-size:12px; opacity:.85; }

.tabs { display:flex; background:#fff; border-bottom:2px solid #e0e0e0; position:sticky; top:56px; z-index:9; }
.tab { flex:1; padding:12px 0; text-align:center; font-size:14px; font-weight:600; color:#888; cursor:pointer; border-bottom:3px solid transparent; transition:.2s; }
.tab.active { color:#c62828; border-bottom-color:#c62828; }

.panel { display:none; }
.panel.active { display:block; }

.card { background:#fff; margin:12px; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden; }
.card-title { padding:14px 16px; font-size:15px; font-weight:700; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; }
.card-body { padding:14px 16px; }

.form-row { margin-bottom:12px; }
.form-row label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:4px; }
.form-row input, .form-row select, .form-row textarea {
  width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px;
  font-family:inherit; outline:none; transition:border .2s;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color:#c62828; }
.form-row textarea { resize:vertical; min-height:80px; }

.btn { padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:.2s; }
.btn-primary { background:#c62828; color:#fff; }
.btn-primary:hover { background:#b71c1c; }
.btn-secondary { background:#f0f0f0; color:#333; }
.btn-danger { background:#fff; color:#d32f2f; border:1px solid #ffcdd2; }
.btn-danger:hover { background:#ffebee; }
.btn-sm { padding:6px 14px; font-size:13px; }
.btn-block { display:block; width:100%; }

/* 사건 카드 */
.inc-card { border:1px solid #e0e0e0; border-radius:10px; margin:12px; overflow:hidden; }
.inc-header { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.inc-header:hover { background:#fafafa; }
.inc-type { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; color:#fff; margin-right:8px; }
.type-화재 { background:#d32f2f; }
.type-구급 { background:#1565c0; }
.type-구조 { background:#e65100; }
.type-기타 { background:#616161; }
.inc-title { font-size:14px; font-weight:600; flex:1; }
.inc-time { font-size:12px; color:#888; }
.inc-body { padding:0 16px 14px; font-size:13px; line-height:1.7; }
.inc-body .row { display:flex; padding:4px 0; border-bottom:1px solid #f5f5f5; }
.inc-body .row:last-child { border:none; }
.inc-body .lbl { width:80px; font-weight:600; color:#555; flex-shrink:0; }
.inc-body .val { flex:1; color:#333; }
.inc-actions { padding:8px 16px 14px; display:flex; gap:8px; justify-content:flex-end; }

/* 조치 목록 */
.action-list { margin:4px 0; padding-left:0; list-style:none; counter-reset:act; }
.action-list li { padding:3px 0; }
.action-list li::before { content:"▸ "; color:#c62828; font-weight:700; }

/* 모달 */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:flex-end; justify-content:center; }
.modal-bg.show { display:flex; }
.modal { background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:760px; max-height:90vh; overflow-y:auto; padding:20px 16px 32px; }
.modal-title { font-size:17px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
.modal-close { background:none; border:none; font-size:24px; color:#888; cursor:pointer; }

/* 조치사항 입력 */
.action-inputs { margin-top:4px; }
.action-row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
.action-row input { flex:1; }
.action-row button { padding:6px 10px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; font-size:16px; }
.action-row button:hover { background:#ffebee; }

/* 출동대 입력 */
.unit-inputs { margin-top:4px; }
.unit-row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
.unit-row input { flex:1; }
.unit-row button { padding:6px 10px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; font-size:16px; }

/* 내보내기 */
.export-box { background:#ffebee; border:1px solid #ef9a9a; border-radius:8px; padding:16px; margin:12px; text-align:center; }
.export-box p { font-size:14px; margin-bottom:12px; color:#b71c1c; }

.empty { text-align:center; padding:40px 16px; color:#aaa; }
.badge { background:#ffebee; color:#c62828; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1 id="headerTitle">119 관제내역 → 상황보고서</h1>
    <small id="headerSub">관제내역을 입력하면 상황보고서 HWPX를 자동 생성합니다</small>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="incidents">관제내역</div>
    <div class="tab" data-tab="settings">기관설정</div>
    <div class="tab" data-tab="export">내보내기</div>
  </div>

  <!-- 관제내역 탭 -->
  <div class="panel active" id="panel-incidents">
    <div style="padding:12px 12px 0;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:15px;font-weight:700;">접수 내역</span>
      <button class="btn btn-primary btn-sm" onclick="openAddInc()">+ 사건 추가</button>
    </div>
    <div id="incList"></div>
  </div>

  <!-- 기관설정 탭 -->
  <div class="panel" id="panel-settings">
    <div class="card">
      <div class="card-title">기관 정보</div>
      <div class="card-body">
        <div class="form-row">
          <label>소방서명</label>
          <input type="text" id="sAgency" placeholder="예: ○○소방서">
        </div>
        <div class="form-row">
          <label>부서</label>
          <input type="text" id="sDept" placeholder="예: 119종합상황실">
        </div>
        <div class="form-row">
          <label>작성자</label>
          <input type="text" id="sReporter" placeholder="예: 상황관제사 김○○">
        </div>
        <div class="form-row">
          <label>보고일자</label>
          <input type="date" id="sDate">
        </div>
        <button class="btn btn-primary btn-block" onclick="saveSettings()" style="margin-top:8px;">저장</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="color:#d32f2f;">데이터 관리</div>
      <div class="card-body" style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="importJSON()">JSON 불러오기</button>
        <button class="btn btn-danger" onclick="resetAll()">전체 초기화</button>
      </div>
    </div>
  </div>

  <!-- 내보내기 탭 -->
  <div class="panel" id="panel-export">
    <div class="export-box">
      <p>관제내역을 JSON으로 내보내면<br><b>generate.py</b>로 상황보고서 HWPX를 자동 생성합니다.</p>
      <button class="btn btn-primary btn-block" onclick="exportJSON()">JSON 다운로드</button>
    </div>
    <div class="card" style="margin-top:4px;">
      <div class="card-title">자동 생성 명령어</div>
      <div class="card-body">
        <code style="display:block;background:#263238;color:#ef9a9a;padding:14px;border-radius:8px;font-size:13px;line-height:1.8;overflow-x:auto;white-space:pre;">python3 report119/generate.py \
  -i 다운받은파일.json \
  -o output/</code>
      </div>
    </div>
    <div class="card">
      <div class="card-title">현재 데이터 요약</div>
      <div class="card-body" id="exportSummary"></div>
    </div>
  </div>
</div>

<!-- 사건 추가/수정 모달 -->
<div class="modal-bg" id="modalInc">
  <div class="modal">
    <div class="modal-title">
      <span id="modalIncTitle">사건 추가</span>
      <button class="modal-close" onclick="closeModal('modalInc')">&times;</button>
    </div>
    <div class="form-row">
      <label>사건번호</label>
      <input type="text" id="iCase" placeholder="예: 2026-031523-001">
    </div>
    <div class="form-row">
      <label>접수일시</label>
      <input type="datetime-local" id="iReceived">
    </div>
    <div style="display:flex;gap:8px;">
      <div class="form-row" style="flex:1;">
        <label>사고유형</label>
        <select id="iType">
          <option>화재</option>
          <option>구급</option>
          <option>구조</option>
          <option>기타</option>
        </select>
      </div>
      <div class="form-row" style="flex:2;">
        <label>세부유형</label>
        <input type="text" id="iSubType" placeholder="예: 건물화재(주거시설)">
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <div class="form-row" style="flex:1;">
        <label>신고자</label>
        <input type="text" id="iCaller" placeholder="예: 박○○ (주민)">
      </div>
      <div class="form-row" style="flex:1;">
        <label>신고자 연락처</label>
        <input type="text" id="iCallerPhone" placeholder="010-XXXX-1234">
      </div>
    </div>
    <div class="form-row">
      <label>발생장소</label>
      <input type="text" id="iLocation" placeholder="주소 입력">
    </div>

    <div class="form-row">
      <label>출동대</label>
      <div class="unit-inputs" id="unitInputs"></div>
      <button class="btn btn-secondary btn-sm" onclick="addUnitRow()" style="margin-top:4px;">+ 출동대 추가</button>
    </div>

    <div style="display:flex;gap:8px;">
      <div class="form-row" style="flex:1;">
        <label>출동시각</label>
        <input type="time" id="iDispatch">
      </div>
      <div class="form-row" style="flex:1;">
        <label>도착시각</label>
        <input type="time" id="iArrival">
      </div>
    </div>

    <div class="form-row">
      <label>상황개요</label>
      <textarea id="iSituation" rows="3" placeholder="사고 발생 상황을 구체적으로 기술"></textarea>
    </div>

    <div class="form-row">
      <label>조치사항 (시간순)</label>
      <div class="action-inputs" id="actionInputs"></div>
      <button class="btn btn-secondary btn-sm" onclick="addActionRow()" style="margin-top:4px;">+ 조치 추가</button>
    </div>

    <div class="form-row">
      <label>인명피해</label>
      <input type="text" id="iCasualties" placeholder="예: 부상 1명, 없음 등">
    </div>
    <div class="form-row">
      <label>재산피해</label>
      <input type="text" id="iDamage" placeholder="예: 주방 내부 일부 소실">
    </div>
    <div class="form-row">
      <label>처리결과</label>
      <textarea id="iResult" rows="2" placeholder="최종 처리 결과"></textarea>
    </div>

    <input type="hidden" id="iEditIdx" value="-1">
    <button class="btn btn-primary btn-block" onclick="saveInc()" style="margin-top:12px;">저장</button>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const STORE_KEY = 'report119';
let D = loadData();

function defaultData() {
  return {
    agency: '',
    department: '119종합상황실',
    report_date: new Date().toISOString().slice(0,10),
    reporter: '',
    incidents: []
  };
}

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultData(); }
  catch { return defaultData(); }
}

function save() { localStorage.setItem(STORE_KEY, JSON.stringify(D)); }

// 탭
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    render();
  });
});

// 모달
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('show'); });
});

// 설정
function loadSettings() {
  document.getElementById('sAgency').value = D.agency;
  document.getElementById('sDept').value = D.department;
  document.getElementById('sReporter').value = D.reporter;
  document.getElementById('sDate').value = D.report_date;
}

function saveSettings() {
  D.agency = document.getElementById('sAgency').value.trim();
  D.department = document.getElementById('sDept').value.trim();
  D.reporter = document.getElementById('sReporter').value.trim();
  D.report_date = document.getElementById('sDate').value;
  save();
  render();
  alert('저장되었습니다.');
}

// 동적 행 (출동대)
function addUnitRow(val='') {
  const div = document.getElementById('unitInputs');
  const row = document.createElement('div');
  row.className = 'unit-row';
  row.innerHTML = `<input type="text" value="${esc(val)}" placeholder="예: 펌프차 1대 (○○119안전센터)"><button onclick="this.parentElement.remove()">&times;</button>`;
  div.appendChild(row);
}

// 동적 행 (조치사항)
function addActionRow(val='') {
  const div = document.getElementById('actionInputs');
  const row = document.createElement('div');
  row.className = 'action-row';
  row.innerHTML = `<input type="text" value="${esc(val)}" placeholder="예: 14:31 현장 도착, 상황 파악"><button onclick="this.parentElement.remove()">&times;</button>`;
  div.appendChild(row);
}

function getInputList(containerId) {
  return [...document.getElementById(containerId).querySelectorAll('input')]
    .map(i => i.value.trim()).filter(v => v);
}

// 사건 추가/수정
function openAddInc() {
  document.getElementById('modalIncTitle').textContent = '사건 추가';
  document.getElementById('iEditIdx').value = '-1';

  // 자동 사건번호 생성
  const now = new Date();
  const dateStr = now.toISOString().slice(0,10).replace(/-/g,'').slice(2);
  const timeStr = now.getHours().toString().padStart(2,'0') + now.getMinutes().toString().padStart(2,'0');
  const seq = String(D.incidents.length + 1).padStart(3,'0');
  document.getElementById('iCase').value = `20${dateStr}${timeStr}-${seq}`;

  const dt = now.toISOString().slice(0,16);
  document.getElementById('iReceived').value = dt;
  document.getElementById('iType').value = '화재';
  document.getElementById('iSubType').value = '';
  document.getElementById('iCaller').value = '';
  document.getElementById('iCallerPhone').value = '';
  document.getElementById('iLocation').value = '';
  document.getElementById('iDispatch').value = '';
  document.getElementById('iArrival').value = '';
  document.getElementById('iSituation').value = '';
  document.getElementById('iCasualties').value = '';
  document.getElementById('iDamage').value = '';
  document.getElementById('iResult').value = '';

  document.getElementById('unitInputs').innerHTML = '';
  addUnitRow();

  document.getElementById('actionInputs').innerHTML = '';
  addActionRow();

  openModal('modalInc');
}

function editInc(idx) {
  const inc = D.incidents[idx];
  document.getElementById('modalIncTitle').textContent = '사건 수정';
  document.getElementById('iEditIdx').value = idx;

  document.getElementById('iCase').value = inc.case_number;
  // received_at: "2026-03-15 14:23" → "2026-03-15T14:23"
  document.getElementById('iReceived').value = inc.received_at.replace(' ', 'T');
  document.getElementById('iType').value = inc.type;
  document.getElementById('iSubType').value = inc.sub_type || '';
  document.getElementById('iCaller').value = inc.caller || '';
  document.getElementById('iCallerPhone').value = inc.caller_phone || '';
  document.getElementById('iLocation').value = inc.location || '';
  document.getElementById('iDispatch').value = inc.dispatch_time || '';
  document.getElementById('iArrival').value = inc.arrival_time || '';
  document.getElementById('iSituation').value = inc.situation || '';
  document.getElementById('iCasualties').value = inc.casualties || '';
  document.getElementById('iDamage').value = inc.damage || '';
  document.getElementById('iResult').value = inc.result || '';

  document.getElementById('unitInputs').innerHTML = '';
  (inc.dispatched_units || []).forEach(u => addUnitRow(u));
  if (!inc.dispatched_units?.length) addUnitRow();

  document.getElementById('actionInputs').innerHTML = '';
  (inc.actions || []).forEach(a => addActionRow(a));
  if (!inc.actions?.length) addActionRow();

  openModal('modalInc');
}

function saveInc() {
  const idx = parseInt(document.getElementById('iEditIdx').value);
  const receivedRaw = document.getElementById('iReceived').value;
  const received = receivedRaw.replace('T', ' ');

  const inc = {
    case_number: document.getElementById('iCase').value.trim(),
    received_at: received,
    type: document.getElementById('iType').value,
    sub_type: document.getElementById('iSubType').value.trim(),
    caller: document.getElementById('iCaller').value.trim(),
    caller_phone: document.getElementById('iCallerPhone').value.trim(),
    location: document.getElementById('iLocation').value.trim(),
    dispatched_units: getInputList('unitInputs'),
    dispatch_time: document.getElementById('iDispatch').value,
    arrival_time: document.getElementById('iArrival').value,
    situation: document.getElementById('iSituation').value.trim(),
    actions: getInputList('actionInputs'),
    casualties: document.getElementById('iCasualties').value.trim() || '없음',
    damage: document.getElementById('iDamage').value.trim() || '없음',
    result: document.getElementById('iResult').value.trim(),
  };

  if (!inc.case_number || !inc.received_at) {
    alert('사건번호와 접수일시는 필수입니다.'); return;
  }

  if (idx >= 0) {
    D.incidents[idx] = inc;
  } else {
    D.incidents.push(inc);
  }
  // 접수일시순 정렬
  D.incidents.sort((a, b) => a.received_at.localeCompare(b.received_at));
  save();
  closeModal('modalInc');
  render();
}

function deleteInc(idx) {
  if (!confirm('이 사건을 삭제하시겠습니까?')) return;
  D.incidents.splice(idx, 1);
  save();
  render();
}

// 렌더링
function render() {
  // 헤더
  if (D.agency) {
    document.getElementById('headerTitle').textContent = D.agency + ' 상황보고서';
    document.getElementById('headerSub').textContent = D.department + ' | ' + D.reporter + ' | ' + D.report_date;
  }

  // 사건 목록
  const list = document.getElementById('incList');
  if (!D.incidents.length) {
    list.innerHTML = '<div class="empty" style="padding:60px 16px;">사건을 추가해주세요</div>';
  } else {
    list.innerHTML = D.incidents.map((inc, i) => {
      const typeClass = 'type-' + (['화재','구급','구조'].includes(inc.type) ? inc.type : '기타');
      return `<div class="inc-card">
        <div class="inc-header" onclick="editInc(${i})">
          <div>
            <span class="inc-type ${typeClass}">${esc(inc.type)}</span>
            <span class="inc-title">${esc(inc.sub_type || inc.type)}</span>
          </div>
          <span class="inc-time">${esc(inc.received_at)}</span>
        </div>
        <div class="inc-body">
          <div class="row"><span class="lbl">사건번호</span><span class="val">${esc(inc.case_number)}</span></div>
          <div class="row"><span class="lbl">장소</span><span class="val">${esc(inc.location)}</span></div>
          <div class="row"><span class="lbl">신고자</span><span class="val">${esc(inc.caller)}</span></div>
          <div class="row"><span class="lbl">출동대</span><span class="val">${(inc.dispatched_units||[]).map(u => esc(u)).join('<br>')}</span></div>
          <div class="row"><span class="lbl">상황</span><span class="val">${esc(inc.situation).substring(0,80)}${inc.situation.length > 80 ? '...' : ''}</span></div>
          <div class="row"><span class="lbl">조치</span><span class="val"><ul class="action-list">${(inc.actions||[]).map(a => '<li>'+esc(a)+'</li>').join('')}</ul></span></div>
          <div class="row"><span class="lbl">인명피해</span><span class="val">${esc(inc.casualties)}</span></div>
          <div class="row"><span class="lbl">결과</span><span class="val">${esc(inc.result)}</span></div>
        </div>
        <div class="inc-actions">
          <button class="btn btn-secondary btn-sm" onclick="editInc(${i})">수정</button>
          <button class="btn btn-danger btn-sm" onclick="deleteInc(${i})">삭제</button>
        </div>
      </div>`;
    }).join('');
  }

  // 내보내기 요약
  const es = document.getElementById('exportSummary');
  const types = {};
  D.incidents.forEach(inc => { types[inc.type] = (types[inc.type]||0) + 1; });
  const typeSummary = Object.entries(types).map(([t,c]) => `${t} ${c}건`).join(', ');
  es.innerHTML = `
    <p style="font-size:14px;"><b>${D.agency || '미설정'}</b> / ${D.department || '미설정'} / ${D.reporter || '미설정'}</p>
    <p style="font-size:14px;margin-top:6px;">보고일자: <b>${D.report_date}</b></p>
    <p style="font-size:14px;margin-top:6px;">총 <b>${D.incidents.length}</b>건 ${typeSummary ? '(' + typeSummary + ')' : ''}</p>
  `;

  loadSettings();
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 내보내기/불러오기
function exportJSON() {
  if (!D.incidents.length) { alert('내보낼 데이터가 없습니다.'); return; }
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `상황보고서_${D.report_date}_${D.agency || 'data'}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON() { document.getElementById('fileInput').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.incidents || !Array.isArray(imported.incidents)) {
        alert('올바른 상황보고서 JSON 형식이 아닙니다.'); return;
      }
      D = imported;
      save();
      render();
      alert('불러오기 완료! ' + D.incidents.length + '건');
    } catch { alert('JSON 파싱 오류'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetAll() {
  if (!confirm('모든 데이터를 초기화하시겠습니까?')) return;
  D = defaultData();
  save();
  render();
}

render();
</script>
</body>
</html>
