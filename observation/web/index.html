<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리반 관찰일지</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'Malgun Gothic','맑은 고딕',sans-serif; background:#f0f2f5; color:#222; }
.app { max-width:720px; margin:0 auto; padding-bottom:80px; }

/* 헤더 */
.header { background:#2e7d32; color:#fff; padding:18px 16px; text-align:center; position:sticky; top:0; z-index:10; }
.header h1 { font-size:18px; }
.header small { font-size:12px; opacity:.85; }

/* 탭 */
.tabs { display:flex; background:#fff; border-bottom:2px solid #e0e0e0; position:sticky; top:56px; z-index:9; }
.tab { flex:1; padding:12px 0; text-align:center; font-size:14px; font-weight:600; color:#888; cursor:pointer; border-bottom:3px solid transparent; transition:.2s; }
.tab.active { color:#2e7d32; border-bottom-color:#2e7d32; }

/* 섹션 */
.panel { display:none; }
.panel.active { display:block; }

/* 카드 */
.card { background:#fff; margin:12px; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08); overflow:hidden; }
.card-title { padding:14px 16px; font-size:15px; font-weight:700; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; }
.card-body { padding:14px 16px; }

/* 폼 */
.form-row { margin-bottom:12px; }
.form-row label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:4px; }
.form-row input, .form-row select, .form-row textarea {
  width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px;
  font-family:inherit; outline:none; transition:border .2s;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color:#2e7d32; }
.form-row textarea { resize:vertical; min-height:80px; }

/* 버튼 */
.btn { padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:.2s; }
.btn-primary { background:#2e7d32; color:#fff; }
.btn-primary:hover { background:#256d29; }
.btn-secondary { background:#f0f0f0; color:#333; }
.btn-danger { background:#fff; color:#d32f2f; border:1px solid #ffcdd2; }
.btn-danger:hover { background:#ffebee; }
.btn-sm { padding:6px 14px; font-size:13px; }
.btn-block { display:block; width:100%; }

/* 아동 목록 */
.child-item {
  display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid #f5f5f5; cursor:pointer; transition:.15s;
}
.child-item:hover { background:#f9fbe7; }
.child-avatar {
  width:36px; height:36px; border-radius:50%; background:#e8f5e9; color:#2e7d32;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; margin-right:12px; flex-shrink:0;
}
.child-info { flex:1; }
.child-info .name { font-size:15px; font-weight:600; }
.child-info .meta { font-size:12px; color:#888; }
.badge { background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600; }

/* 관찰 기록 카드 */
.obs-card { border:1px solid #e8e8e8; border-radius:8px; padding:12px; margin-bottom:10px; position:relative; }
.obs-card .obs-date { font-size:12px; color:#888; }
.obs-card .obs-area { display:inline-block; background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:600; margin:4px 0; }
.obs-card .obs-text { font-size:14px; line-height:1.6; margin:6px 0; }
.obs-card .obs-eval { font-size:13px; color:#555; background:#fafafa; padding:8px; border-radius:6px; margin-top:6px; }
.obs-card .obs-eval::before { content:"평가: "; font-weight:600; color:#2e7d32; }
.obs-del { position:absolute; top:8px; right:8px; background:none; border:none; color:#ccc; cursor:pointer; font-size:18px; }
.obs-del:hover { color:#d32f2f; }

/* 내보내기 */
.export-box { background:#f9fbe7; border:1px solid #c5e1a5; border-radius:8px; padding:16px; margin:12px; text-align:center; }
.export-box p { font-size:14px; margin-bottom:12px; color:#33691e; }

/* 비어있을 때 */
.empty { text-align:center; padding:40px 16px; color:#aaa; }
.empty-icon { font-size:48px; margin-bottom:8px; }

/* 모달 */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:flex-end; justify-content:center; }
.modal-bg.show { display:flex; }
.modal { background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:720px; max-height:85vh; overflow-y:auto; padding:20px 16px 32px; }
.modal-title { font-size:17px; font-weight:700; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
.modal-close { background:none; border:none; font-size:24px; color:#888; cursor:pointer; }

/* 반 설정 요약 */
.setting-summary { display:flex; gap:8px; flex-wrap:wrap; padding:4px 0; }
.setting-chip { background:#f0f0f0; padding:4px 10px; border-radius:6px; font-size:13px; }

/* 영역 색상 */
.area-신체운동건강 { background:#e3f2fd!important; color:#1565c0!important; }
.area-의사소통 { background:#fff3e0!important; color:#e65100!important; }
.area-사회관계 { background:#fce4ec!important; color:#c62828!important; }
.area-예술경험 { background:#f3e5f5!important; color:#6a1b9a!important; }
.area-자연탐구 { background:#e8f5e9!important; color:#2e7d32!important; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1 id="headerTitle">우리반 관찰일지</h1>
    <small id="headerSub">반 설정을 먼저 해주세요</small>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="children">아이들</div>
    <div class="tab" data-tab="observe">관찰 기록</div>
    <div class="tab" data-tab="settings">설정</div>
    <div class="tab" data-tab="export">내보내기</div>
  </div>

  <!-- ===== 아이들 탭 ===== -->
  <div class="panel active" id="panel-children">
    <div class="card">
      <div class="card-title">
        <span>우리반 아이들</span>
        <button class="btn btn-primary btn-sm" onclick="openAddChild()">+ 추가</button>
      </div>
      <div id="childList"></div>
    </div>
  </div>

  <!-- ===== 관찰 기록 탭 ===== -->
  <div class="panel" id="panel-observe">
    <div class="card">
      <div class="card-title">
        <span>관찰 기록 작성</span>
        <button class="btn btn-primary btn-sm" onclick="openAddObs()">+ 기록</button>
      </div>
    </div>
    <div id="obsByChild"></div>
  </div>

  <!-- ===== 설정 탭 ===== -->
  <div class="panel" id="panel-settings">
    <div class="card">
      <div class="card-title">반 정보 설정</div>
      <div class="card-body">
        <div class="form-row">
          <label>유치원명</label>
          <input type="text" id="sKinder" placeholder="예: 햇살유치원">
        </div>
        <div class="form-row">
          <label>반 이름</label>
          <input type="text" id="sClass" placeholder="예: 해바라기반">
        </div>
        <div class="form-row">
          <label>담당 교사</label>
          <input type="text" id="sTeacher" placeholder="예: 김선생">
        </div>
        <div class="form-row">
          <label>연도</label>
          <input type="number" id="sYear" value="2026">
        </div>
        <div class="form-row">
          <label>월</label>
          <select id="sMonth">
            <option value="1">1월</option><option value="2">2월</option><option value="3" selected>3월</option>
            <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
            <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
            <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block" onclick="saveSettings()" style="margin-top:8px;">저장</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="color:#d32f2f;">데이터 관리</div>
      <div class="card-body" style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="importJSON()">JSON 불러오기</button>
        <button class="btn btn-danger" onclick="resetAll()">전체 초기화</button>
      </div>
    </div>
  </div>

  <!-- ===== 내보내기 탭 ===== -->
  <div class="panel" id="panel-export">
    <div class="export-box">
      <p>관찰 데이터를 JSON으로 내보내면<br><b>generate.py</b>로 HWPX 관찰일지를 자동 생성할 수 있습니다.</p>
      <button class="btn btn-primary btn-block" onclick="exportJSON()">JSON 다운로드</button>
    </div>
    <div class="card" style="margin-top:4px;">
      <div class="card-title">자동 생성 명령어</div>
      <div class="card-body">
        <code style="display:block;background:#263238;color:#aed581;padding:14px;border-radius:8px;font-size:13px;line-height:1.8;overflow-x:auto;white-space:pre;">python3 observation/generate.py \
  -i 다운받은파일.json \
  -o output/</code>
      </div>
    </div>
    <div class="card">
      <div class="card-title">현재 데이터 요약</div>
      <div class="card-body" id="exportSummary"></div>
    </div>
  </div>
</div>

<!-- 아동 추가 모달 -->
<div class="modal-bg" id="modalChild">
  <div class="modal">
    <div class="modal-title">
      <span id="modalChildTitle">아이 추가</span>
      <button class="modal-close" onclick="closeModal('modalChild')">&times;</button>
    </div>
    <div class="form-row">
      <label>이름</label>
      <input type="text" id="cName" placeholder="이름">
    </div>
    <div class="form-row">
      <label>나이 (만)</label>
      <select id="cAge">
        <option value="3">만 3세</option>
        <option value="4">만 4세</option>
        <option value="5" selected>만 5세</option>
      </select>
    </div>
    <input type="hidden" id="cEditIdx" value="-1">
    <button class="btn btn-primary btn-block" onclick="saveChild()" style="margin-top:12px;">저장</button>
  </div>
</div>

<!-- 관찰 기록 추가 모달 -->
<div class="modal-bg" id="modalObs">
  <div class="modal">
    <div class="modal-title">
      <span>관찰 기록 작성</span>
      <button class="modal-close" onclick="closeModal('modalObs')">&times;</button>
    </div>
    <div class="form-row">
      <label>아동 선택</label>
      <select id="oChild"></select>
    </div>
    <div class="form-row">
      <label>날짜</label>
      <input type="date" id="oDate">
    </div>
    <div class="form-row">
      <label>시간</label>
      <input type="time" id="oTime" value="10:00">
    </div>
    <div class="form-row">
      <label>누리과정 영역</label>
      <select id="oArea">
        <option>신체운동·건강</option>
        <option>의사소통</option>
        <option>사회관계</option>
        <option>예술경험</option>
        <option>자연탐구</option>
      </select>
    </div>
    <div class="form-row">
      <label>관찰 내용</label>
      <textarea id="oContent" rows="4" placeholder="아이의 행동, 말, 상황을 구체적으로 적어주세요."></textarea>
    </div>
    <div class="form-row">
      <label>교사 평가</label>
      <textarea id="oEval" rows="3" placeholder="발달 수준, 특이사항, 지원 방향 등"></textarea>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveObs()" style="margin-top:12px;">저장</button>
  </div>
</div>

<!-- 파일 불러오기 (숨김) -->
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ===== 데이터 =====
const STORE_KEY = 'obs_journal';
let D = loadData();

function defaultData() {
  return {
    kindergarten: '',
    class_name: '',
    teacher: '',
    year: new Date().getFullYear(),
    month: new Date().getMonth() + 1,
    children: []
  };
}

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultData(); }
  catch { return defaultData(); }
}

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(D));
}

// ===== 탭 =====
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    render();
  });
});

// ===== 모달 =====
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// 모달 밖 클릭 닫기
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('show'); });
});

// ===== 설정 =====
function loadSettings() {
  document.getElementById('sKinder').value = D.kindergarten;
  document.getElementById('sClass').value = D.class_name;
  document.getElementById('sTeacher').value = D.teacher;
  document.getElementById('sYear').value = D.year;
  document.getElementById('sMonth').value = D.month;
}

function saveSettings() {
  D.kindergarten = document.getElementById('sKinder').value.trim();
  D.class_name = document.getElementById('sClass').value.trim();
  D.teacher = document.getElementById('sTeacher').value.trim();
  D.year = parseInt(document.getElementById('sYear').value) || new Date().getFullYear();
  D.month = parseInt(document.getElementById('sMonth').value) || 1;
  save();
  render();
  alert('저장되었습니다.');
}

// ===== 아동 =====
function openAddChild() {
  document.getElementById('cName').value = '';
  document.getElementById('cAge').value = '5';
  document.getElementById('cEditIdx').value = '-1';
  document.getElementById('modalChildTitle').textContent = '아이 추가';
  openModal('modalChild');
}

function editChild(idx) {
  const c = D.children[idx];
  document.getElementById('cName').value = c.name;
  document.getElementById('cAge').value = c.age;
  document.getElementById('cEditIdx').value = idx;
  document.getElementById('modalChildTitle').textContent = '아이 수정';
  openModal('modalChild');
}

function saveChild() {
  const name = document.getElementById('cName').value.trim();
  const age = parseInt(document.getElementById('cAge').value);
  const idx = parseInt(document.getElementById('cEditIdx').value);
  if (!name) { alert('이름을 입력해주세요.'); return; }

  if (idx >= 0) {
    D.children[idx].name = name;
    D.children[idx].age = age;
  } else {
    D.children.push({ name, age, observations: [] });
  }
  save();
  closeModal('modalChild');
  render();
}

function deleteChild(idx) {
  const c = D.children[idx];
  if (!confirm(c.name + '을(를) 삭제하시겠습니까?\n관찰 기록도 함께 삭제됩니다.')) return;
  D.children.splice(idx, 1);
  save();
  render();
}

// ===== 관찰 기록 =====
function openAddObs(childIdx) {
  const sel = document.getElementById('oChild');
  sel.innerHTML = D.children.map((c, i) =>
    `<option value="${i}" ${i === childIdx ? 'selected' : ''}>${c.name} (만${c.age}세)</option>`
  ).join('');

  if (!D.children.length) { alert('아이를 먼저 추가해주세요.'); return; }

  const today = new Date();
  document.getElementById('oDate').value = today.toISOString().slice(0, 10);
  document.getElementById('oTime').value = today.getHours().toString().padStart(2,'0') + ':' + today.getMinutes().toString().padStart(2,'0');
  document.getElementById('oArea').value = '신체운동·건강';
  document.getElementById('oContent').value = '';
  document.getElementById('oEval').value = '';
  openModal('modalObs');
}

function saveObs() {
  const ci = parseInt(document.getElementById('oChild').value);
  const date = document.getElementById('oDate').value;
  const time = document.getElementById('oTime').value;
  const area = document.getElementById('oArea').value;
  const observation = document.getElementById('oContent').value.trim();
  const evaluation = document.getElementById('oEval').value.trim();

  if (!observation) { alert('관찰 내용을 입력해주세요.'); return; }

  D.children[ci].observations.push({ date, time, area, observation, evaluation });
  // 날짜순 정렬
  D.children[ci].observations.sort((a, b) => a.date.localeCompare(b.date));
  save();
  closeModal('modalObs');
  render();
}

function deleteObs(ci, oi) {
  if (!confirm('이 관찰 기록을 삭제하시겠습니까?')) return;
  D.children[ci].observations.splice(oi, 1);
  save();
  render();
}

// ===== 렌더링 =====
function areaClass(area) {
  return 'area-' + area.replace(/[·\s]/g, '');
}

function render() {
  // 헤더
  if (D.class_name) {
    document.getElementById('headerTitle').textContent = D.class_name + ' 관찰일지';
    document.getElementById('headerSub').textContent = D.kindergarten + ' | ' + D.teacher + ' 선생님 | ' + D.year + '년 ' + D.month + '월';
  }

  // 아동 목록
  const cl = document.getElementById('childList');
  if (!D.children.length) {
    cl.innerHTML = '<div class="empty"><div class="empty-icon">&#128118;</div>아이를 추가해주세요</div>';
  } else {
    cl.innerHTML = D.children.map((c, i) => {
      const cnt = c.observations.length;
      return `<div class="child-item">
        <div class="child-avatar">${c.name[0]}</div>
        <div class="child-info" onclick="editChild(${i})">
          <div class="name">${esc(c.name)}</div>
          <div class="meta">만 ${c.age}세 · 관찰 ${cnt}건</div>
        </div>
        <span class="badge">${cnt}건</span>
        <button class="obs-del" onclick="deleteChild(${i})" title="삭제">&times;</button>
      </div>`;
    }).join('');
  }

  // 관찰 기록 (아동별)
  const ob = document.getElementById('obsByChild');
  if (!D.children.length) {
    ob.innerHTML = '<div class="empty" style="margin-top:20px;"><div class="empty-icon">&#128221;</div>아이를 먼저 추가하고<br>관찰 기록을 작성해주세요</div>';
  } else {
    ob.innerHTML = D.children.map((c, ci) => {
      const obsHtml = c.observations.length
        ? c.observations.map((o, oi) => `
          <div class="obs-card">
            <button class="obs-del" onclick="deleteObs(${ci},${oi})">&times;</button>
            <span class="obs-date">${o.date} ${o.time || ''}</span>
            <span class="obs-area ${areaClass(o.area)}">${esc(o.area)}</span>
            <div class="obs-text">${esc(o.observation)}</div>
            ${o.evaluation ? `<div class="obs-eval">${esc(o.evaluation)}</div>` : ''}
          </div>`).join('')
        : '<div style="padding:12px;color:#aaa;font-size:13px;text-align:center;">아직 기록이 없습니다</div>';

      return `<div class="card">
        <div class="card-title">
          <span>${esc(c.name)} <span style="font-weight:400;color:#888;font-size:13px;">(만${c.age}세)</span></span>
          <button class="btn btn-primary btn-sm" onclick="openAddObs(${ci})">+ 기록</button>
        </div>
        ${obsHtml}
      </div>`;
    }).join('');
  }

  // 내보내기 요약
  const es = document.getElementById('exportSummary');
  const totalObs = D.children.reduce((s, c) => s + c.observations.length, 0);
  es.innerHTML = `
    <div class="setting-summary">
      <span class="setting-chip">${D.kindergarten || '미설정'}</span>
      <span class="setting-chip">${D.class_name || '미설정'}</span>
      <span class="setting-chip">${D.teacher || '미설정'} 선생님</span>
      <span class="setting-chip">${D.year}년 ${D.month}월</span>
    </div>
    <p style="margin-top:10px;font-size:14px;">아동 <b>${D.children.length}</b>명 · 관찰 기록 <b>${totalObs}</b>건</p>
    ${D.children.map(c => `<p style="font-size:13px;color:#666;margin-top:4px;">  ${c.name}: ${c.observations.length}건</p>`).join('')}
  `;

  loadSettings();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== 내보내기/불러오기 =====
function exportJSON() {
  if (!D.children.length) { alert('내보낼 데이터가 없습니다.'); return; }
  const blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `관찰일지_${D.year}년${String(D.month).padStart(2,'0')}월_${D.class_name || 'data'}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON() {
  document.getElementById('fileInput').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.children || !Array.isArray(imported.children)) {
        alert('올바른 관찰일지 JSON 형식이 아닙니다.'); return;
      }
      D = imported;
      save();
      render();
      alert('불러오기 완료! 아동 ' + D.children.length + '명');
    } catch { alert('JSON 파싱 오류'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetAll() {
  if (!confirm('모든 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) return;
  D = defaultData();
  save();
  render();
}

// ===== 초기화 =====
render();
</script>
</body>
